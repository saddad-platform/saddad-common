# Releases saddad-common through JitPack.
#
# There is nothing to upload and no credential to hold. JitPack watches the repository, and the
# first time anybody asks for a version it clones that tag, builds it and serves the result. So a
# release here is really three things:
#
#   1. make sure the tag and the POM say the same version, and that the tag builds cleanly
#      (tests are not run here - ./verify.sh runs them on your machine before you tag);
#   2. ask JitPack to build it now and wait for the answer, so a broken build is found by the
#      person who caused it rather than by the next developer who needs the version;
#   3. open a pull request on every service that uses the library.
#
# See RELEASING.md.
name: Release

on:
  release:
    types: [published]
  # Re-runnable by hand, and rehearsable with dry_run.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, for example 1.0.1'
        required: true
        type: string
      dry_run:
        description: 'Check and build everything, but do not ask JitPack or open pull requests'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.jitpack.outputs.published }}
    steps:
      - name: Work out which tag is being released
        id: tag
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${EVENT_TAG:-$INPUT_TAG}"
          if [ -z "$tag" ]; then
            echo "::error::no tag to release - this runs on a published release or with a tag input"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Check the tag and the project version are the same text
        id: version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          actual=$(mvn --batch-mode --no-transfer-progress \
            help:evaluate -Dexpression=project.version -q -DforceStdout)

          # With JitPack the tag *is* the version a consumer writes, so a `v` prefix would put
          # <version>v1.0.1</version> into six service POMs. One convention: plain versions.
          case "$TAG" in
            v*)
              echo "::error::tag ${TAG} starts with 'v'. On JitPack the tag becomes the version"
              echo "::error::consumers write, so tag it ${TAG#v} instead and release that."
              exit 1
              ;;
          esac

          if [ "$TAG" != "$actual" ]; then
            echo "::error::tag ${TAG} and the POM version ${actual} disagree."
            echo "::error::JitPack builds the tag, so what consumers get would not be what the"
            echo "::error::POM says. Set the POM to ${TAG}, commit, and tag that commit."
            exit 1
          fi

          case "$actual" in
            *SNAPSHOT*)
              echo "::error::${actual} is a snapshot. Release a fixed version."
              exit 1
              ;;
          esac

          echo "version=$actual" >> "$GITHUB_OUTPUT"
          echo "Releasing ${actual}"

      - name: Build exactly what JitPack will build
        # The same command JitPack runs, so a tag that builds here builds there. Tests are not
        # run on Actions on this platform: run ./verify.sh before you tag, which RELEASING.md
        # makes step one for exactly this reason. What this proves is that the tag compiles and
        # produces all three jars from a clean checkout.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress -Prelease -DskipTests package
          for suffix in "" "-sources" "-javadoc"; do
            file="target/saddad-common-${VERSION}${suffix}.jar"
            [ -f "$file" ] || { echo "::error::the build did not produce ${file}"; exit 1; }
            echo "built ${file}"
          done

      - name: Ask JitPack to build it, and wait for the answer
        id: jitpack
        if: ${{ github.event_name == 'release' || inputs.dry_run == false }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          base="https://jitpack.io/com/github/${OWNER}/saddad-common/${VERSION}"

          # Requesting the POM is what makes JitPack start building; the API then reports how it
          # went.
          echo "Asking JitPack for com.github.${OWNER}:saddad-common:${VERSION}"
          curl -s -o /dev/null "${base}/saddad-common-${VERSION}.pom" || true

          for attempt in $(seq 1 40); do
            status=$(curl -s "https://jitpack.io/api/builds/com.github.${OWNER}/saddad-common/${VERSION}" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
            case "$status" in
              ok)
                echo "JitPack built ${VERSION} successfully."
                echo "published=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              Error|error)
                echo "::error::JitPack failed to build ${VERSION}."
                echo "::error::The log says why: ${base}/build.log"
                exit 1
                ;;
              *)
                echo "  attempt ${attempt}/40: JitPack says '${status:-building}'"
                sleep 15
                ;;
            esac
          done

          # Not a failed release: the tag is fine and JitPack will finish on its own.
          echo "::warning::JitPack was still building after ten minutes."
          echo "::warning::Check https://jitpack.io/#${OWNER}/saddad-common, then run"
          echo "::warning::'Update consuming services' by hand for ${VERSION}."
          echo "published=false" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PUBLISHED: ${{ steps.jitpack.outputs.published }}
          OWNER: ${{ github.repository_owner }}
        run: |
          {
            echo "## Release"
            echo
            if [ "${PUBLISHED:-false}" = "true" ]; then
              echo "JitPack build: **SUCCESS** - the version is available now."
            else
              echo "JitPack build: **not confirmed** (dry run, still building, or stopped earlier)."
            fi
            echo
            echo "Consumers use:"
            echo
            echo '```xml'
            echo "<dependency>"
            echo "    <groupId>com.github.${OWNER}</groupId>"
            echo "    <artifactId>saddad-common</artifactId>"
            echo "    <version>${VERSION:-unknown}</version>"
            echo "</dependency>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Separate, so a problem opening pull requests is never mistaken for a problem with the
  # release, and so it can be re-run on its own.
  update-consumers:
    name: Update consuming services
    needs: release
    if: ${{ needs.release.outputs.published == 'true' }}
    uses: ./.github/workflows/update-consumers.yml
    with:
      version: ${{ needs.release.outputs.version }}
      dry_run: false
    secrets: inherit
