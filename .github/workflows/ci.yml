# Builds saddad-common on every change.
#
# It does not run test cases. That is this platform's rule for GitHub Actions: tests run on a
# developer's machine through ./verify.sh, before pushing.
#
# What it does do is worth having on every push - it proves the project still compiles and still
# produces the three jars JitPack will serve, from a clean checkout on a machine that is not
# yours. That catches exactly the things a local build hides: a file that was never committed, a
# dependency that only exists in your own ~/.m2, a difference in JDK.
#
# This repository is public, and GitHub Actions is free and unlimited on public repositories, so
# none of this is billed. The minutes that are billed belong to the private service repositories.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # The same command JitPack runs, so this is a rehearsal of the real thing rather than an
      # approximation of it. Tests are skipped here and JitPack skips them too.
      - name: Build the artifacts JitPack will build
        run: >
          ./mvnw --batch-mode --no-transfer-progress
          -Prelease -DskipTests package

      - name: Check all three artifacts exist
        run: |
          set -euo pipefail
          version=$(./mvnw --batch-mode --no-transfer-progress \
            help:evaluate -Dexpression=project.version -q -DforceStdout)
          for suffix in "" "-sources" "-javadoc"; do
            file="target/saddad-common-${version}${suffix}.jar"
            if [ ! -f "$file" ]; then
              echo "::error::the build did not produce ${file}"
              exit 1
            fi
            echo "found ${file}"
          done
