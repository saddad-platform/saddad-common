# Builds saddad-common. Started by hand only.
#
# Two deliberate absences:
#
#   1. No automatic trigger. Nothing here runs on a push or a pull request.
#   2. No tests. Test cases are not run on GitHub Actions on this platform - they run on your
#      machine, through ./verify.sh, which is faster to read and costs nothing.
#
# What is left is worth a button: it proves the project still compiles and still produces the
# three jars JitPack will serve, from a clean checkout on a machine that is not yours. That
# catches the things a local build hides - a file never committed, a dependency only in your
# own ~/.m2, a JDK difference.
name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # The same command JitPack runs, so this is a rehearsal of the real thing rather than an
      # approximation of it. Tests are skipped here and JitPack skips them too.
      - name: Build the artifacts JitPack will build
        run: >
          mvn --batch-mode --no-transfer-progress
          -Prelease -DskipTests package

      - name: Check all three artifacts exist
        run: |
          set -euo pipefail
          version=$(mvn --batch-mode --no-transfer-progress \
            help:evaluate -Dexpression=project.version -q -DforceStdout)
          for suffix in "" "-sources" "-javadoc"; do
            file="target/saddad-common-${version}${suffix}.jar"
            if [ ! -f "$file" ]; then
              echo "::error::the build did not produce ${file}"
              exit 1
            fi
            echo "found ${file}"
          done
